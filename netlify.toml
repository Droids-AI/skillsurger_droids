[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/book-diagnosis"
  to = "/book-a-call"
  status = 301
  force = true

[[redirects]]
  from = "/forward-deployed-ai-engineer"
  to = "/courses/forward-deployed-ai-engineer"
  status = 301
  force = true

[[redirects]]
  from = "/training"
  to = "/job-switch-copilot"
  status = 301
  force = true

[[redirects]]
  from = "/pricing"
  to = "/job-switch-copilot#programme"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
